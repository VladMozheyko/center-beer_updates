# ==================================================
# SERVER CONFIGURATION
# ==================================================
server.ssl.enabled=false

#================== Swagger ==================
#-----with_dependency_enabled springdoc-openapi, UI available_at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.url=/updates/v3/api-docs
springdoc.swagger-ui.config-url=/updates/v3/api-docs/swagger-config

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.use-root-path=true

# ==================================================
# DATABASE (MySQL)
# ==================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/app_updater?serverTimezone=Europe/Moscow
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.validation-timeout=5000

# ==================================================
# JPA / HIBERNATE
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.server.base-url=https://kotitonttu.tech
app.contact.mail-address=mail@mail.com

app.x-api-key=${API_KEY}

logging.level.root = INFO

#===trust in forwarded headers============
server.forward-headers-strategy=framework

